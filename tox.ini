[tox]
env_list = cov, py311, py312, py313, py314
isolated_build = true
skip_missing_interpreters = true

[testenv]
deps =
    pytest>=8
    pytest-asyncio
    pico-ioc>=2.3.3
    pico-boot>=0.1.0
    pico-fastapi>=0.3.1
    httpx
commands = pytest {posargs:tests}

[testenv:cov]
deps =
    {[testenv]deps}
    coverage>=7
package = editable
setenv =
    COVERAGE_FILE = {tox_root}/.coverage
# coverage starts BEFORE pytest so the plugin's import-time lines are
# traced (pytest --cov would load this plugin before coverage begins)
commands =
    coverage run -m pytest tests
    coverage report --show-missing
